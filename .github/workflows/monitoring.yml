name: Maintain Loop — Anomaly Detection to Intent PR

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      health_url:
        description: "Override PRODUCTION_HEALTH_URL"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    name: Probe /api/health & Escalate 3-Sigma Incidents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Deterministic Anomaly Detector
        id: detector
        env:
          PRODUCTION_HEALTH_URL: ${{ inputs.health_url || vars.PRODUCTION_HEALTH_URL || secrets.PRODUCTION_HEALTH_URL }}
        run: |
          if [ -z "$PRODUCTION_HEALTH_URL" ]; then
            echo "PRODUCTION_HEALTH_URL not configured; skipping live probe."
            exit 0
          fi
          node scripts/monitoring/anomaly_detector.mjs --url "$PRODUCTION_HEALTH_URL" --history docs/sdlc/monitoring/history.json --incident-dir docs/sdlc/incidents

      - name: Open Incident Intent PR (never push directly to main)
        run: |
          if git status --porcelain docs/sdlc/incidents/ | grep -q "intent-INC-"; then
            BRANCH="incident/auto-$(date -u +%Y%m%d%H%M%S)"
            git config user.name "tg-naydi-monitor[bot]"
            git config user.email "monitor@tgnaydi.local"
            git checkout -b "$BRANCH"
            git add docs/sdlc/incidents/
            git commit -m "chore(maintain): open auto-generated incident intent from anomaly detector"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Incident Intent: Production Anomaly Detected" --body "Automatically generated by scripts/monitoring/anomaly_detector.mjs after Level-3 anomaly breach. Requires human service owner triage."
          else
            echo "No Level-3 incident generated."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
